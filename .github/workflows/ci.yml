name: ci

on: [push, pull_request]

jobs:
  scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
          mpicc --version | head -1
          mpirun --version | head -1
          nproc

      - name: Build
        run: make build CFLAGS="-O3 -march=native -Wall -Wextra -std=c11"

      - name: Checksum must not depend on the rank count or halo mode
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          sums = {}
          for mode in ('sendrecv', 'isend'):
              for p in (1, 2, 4):
                  out = subprocess.run(
                      ['mpirun', '--oversubscribe', '-np', str(p), './build/heat_mpi',
                       '-n', '256', '-t', '50', '-r', '1', '-m', mode],
                      capture_output=True, text=True, check=True).stdout.strip().splitlines()[-1]
                  sums[(mode, p)] = out.split(',')[-1]
                  print(f'{mode} {p} ranks -> checksum {sums[(mode, p)]}  ({out})')
          if len(set(sums.values())) != 1:
              print('FAIL: checksum changed with rank count or mode', file=sys.stderr)
              sys.exit(1)
          print('ok: decomposition and Isend overlap preserve the exact answer')
          EOF

      - name: Small scaling run
        run: NP_LIST="1 2 4" make bench
